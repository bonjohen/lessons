# fly.toml — Fly.io configuration for Lessons Hub backend
# See https://fly.io/docs/reference/configuration/

app = "lessons-hub"
primary_region = "sea"

[build]
  dockerfile = "backend/Dockerfile"

  [build.args]
    PROFILE = "openai"

[env]
  DEPLOYMENT_PROFILE = "flyio"
  CHROMADB_PERSIST_DIR = "/data/chroma"

[mounts]
  source = "chroma_data"
  destination = "/data/chroma"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    type = "http"
    port = 8000
    path = "/health"
    interval = "30s"
    timeout = "5s"
