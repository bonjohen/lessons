[project]
name = "lessons-hub-backend"
version = "2.0.0"
description = "RAG backend for Lessons Hub"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2",
    "chromadb>=1.0",
    "ollama>=0.4",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "httpx>=0.28",
]
aws = [
    "boto3>=1.35",
    "opensearch-py>=2.7",
    "requests-aws4auth>=1.3",
]
azure = [
    "openai>=1.40",
    "azure-search-documents>=11.5",
    "azure-identity>=1.17",
]
gcp = [
    "google-cloud-aiplatform>=1.60",
    "vertexai>=1.60",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
