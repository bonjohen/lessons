name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -e "backend[dev,metrics]"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint backend
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run project tests
        run: pytest tests/

      - name: Run backend tests
        run: cd backend && pytest tests/

      - name: Harvest lessons
        run: npm run harvest
        env:
          LESSONS_REPO_TOKEN: ${{ secrets.LESSONS_REPO_TOKEN }}

      - name: Validate lessons
        run: npm run validate:lessons

      - name: Build RAG corpus
        run: npm run corpus

      - name: Validate RAG corpus
        run: npm run validate:corpus

      - name: Build site
        run: npm run build

      - name: Index with Pagefind
        run: npm run index

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
