name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -e backend[dev]

      - name: Install Node dependencies
        run: npm ci

      - name: Lint backend
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run project tests
        run: pytest tests/

      - name: Run backend tests
        run: cd backend && pytest tests/

      - name: Full build pipeline
        run: npm run build:full
        env:
          LESSONS_REPO_TOKEN: ${{ secrets.LESSONS_REPO_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (staging)
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify site is reachable
        run: |
          SITE_URL="${{ needs.deploy.outputs.page_url || 'https://bonjohen.github.io/lessons/' }}"
          echo "Checking $SITE_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "Smoke test FAILED: got HTTP $STATUS"
            exit 1
          fi
          echo "Smoke test PASSED"

      - name: Verify lessons page loads
        run: |
          SITE_URL="${{ needs.deploy.outputs.page_url || 'https://bonjohen.github.io/lessons/' }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}lessons/")
          echo "Lessons page HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "Lessons page smoke test FAILED"
            exit 1
          fi
          echo "Lessons page smoke test PASSED"
